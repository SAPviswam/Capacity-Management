_schema-version: 3.3.0
ID: capacitymanagement
description: A simple CAP project.
version: 1.0.0
modules:
  - name: capacitymanagement-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: capacitymanagement-auth
      - name: capacitymanagement-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-http-endpoint: /health
      readiness-health-check-type: http
    build-parameters:
      builder: npm
  - name: capacitymanagement
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: capacitymanagement-auth
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M
  - name: capacitymanagement-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: capacitymanagement-db
    parameters:
      buildpack: nodejs_buildpack
resources:
  - name: capacitymanagement-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: capacitymanagement-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
  - name: capacitymanagement-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: capacitymanagement_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
